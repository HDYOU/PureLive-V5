name: my-test-build

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布 Release 的 Tag（留空则读取 assets/version.json）"
        required: false
      ssh:
        description: "SSH connection to Actions"
        required: false
        default: "false"
  watch:
    types: [started]
  push:
    branches:
      - master
      - main
      - '*'
    paths-ignore:
      - "**.md"
      - ".github/**"
      - "!.github/workflows/my-test-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: macos-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v7

      - name: 下载 Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: key.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 创建 key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > apps/pure_live/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> apps/pure_live/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> apps/pure_live/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> apps/pure_live/android/key.properties

      # ====================== 自动修改 ：AndroidManifest 添加 extractNativeLibs="true" ======================
      - name: Add extractNativeLibs="true" to AndroidManifest.xml
        run: |
          MANIFEST="apps/pure_live/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if grep -q 'android:extractNativeLibs' "$MANIFEST"; then
            echo "⚠️ extractNativeLibs 已存在，跳过"
            else
              # 使用临时文件方式，避免 sed i/a 的兼容性问题
              awk '
                /android:name="\.MainActivity"/ { in_activity=1 }
                in_activity && /android:windowSoftInputMode="adjustResize"/ && !done {
                  print "      android:extractNativeLibs=\"true\""
                done=1
                 }
                { print }
                in_activity && /\/>/ { in_activity=0 }
               ' "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               echo "✅ 已添加 android:extractNativeLibs=\"true\""
              fi
              grep -A5 -B5 "extractNativeLibs" "$MANIFEST"
          else
            echo "⚠️ $MANIFEST 不存在，跳过"
          fi

      # ====================== 自动修改 压缩 apk 包 ======================
      - name: 压缩 apk 包
        run: |
          MANIFEST="apps/pure_live/android/app/build.gradle.kts"
          if [ -f "$MANIFEST" ]; then
            if grep -q 'useLegacyPackaging' "$MANIFEST"; then
            echo "⚠️ extractNativeLibs 已存在，跳过"
            else
              # 使用临时文件方式，避免 sed i/a 的兼容性问题
              awk '
              /^[[:space:]]*signingConfigs[[:space:]]*\{/ && !done {
                  match($0, /^[[:space:]]*/)
                  indent = substr($0, 1, RLENGTH)
                  print indent "packaging {"
                  print indent "    jniLibs {"
                  print indent "        useLegacyPackaging = true"
                  print indent "    }"
                  print indent "}"
                  print ""
                  done = 1
              }
              { print }
               ' "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               echo "✅ 已添加 useLegacyPackaging=\"true\""
              fi
              grep -A5 -B5 "useLegacyPackaging" "$MANIFEST"
          else
            echo "⚠️ $MANIFEST 不存在，跳过"
          fi

      # ====================== 自动修改  斗鱼直播支持 hevc ======================
      - name: 斗鱼直播支持 hevc
        run: |
          MANIFEST="packages/live_core/lib/src/sites/douyu/douyu_api.dart"
          if [ -f "$MANIFEST" ]; then
            if grep -q "'hevc': '1'" "$MANIFEST"; then
            echo "⚠️ 斗鱼直播支持 hevc 已存在，跳过"
            else
               sed "s/'hevc': '0'/'hevc': '1'/g" "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               echo "✅ 已添加  'hevc': '1',斗鱼直播支持 hevc"
              fi
              grep -A5 -B5 "'hevc':" "$MANIFEST"
          else
            echo "⚠️ $MANIFEST 不存在，跳过"
          fi

      # ====================== 自动修改  bilibili 直播支持 hevc ======================
      - name: bilibili 直播支持 hevc
        run: |
          MANIFEST="packages/live_core/lib/src/sites/bilibili/bilibili_site.dart"
          if [ -f "$MANIFEST" ]; then
            if grep -q "'codec': '2,1'" "$MANIFEST"; then
            echo "⚠️ bilibili直播支持 hevc 已存在，跳过"
            else
               sed "s/'codec': '0'/'codec': '2,1,0'/g" "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               echo "✅ 已添加 , 直播支持 hevc"
              fi
              echo "$MANIFEST"
              grep -A5 -B5 "'codec':" "$MANIFEST"
          else
            echo "⚠️ $MANIFEST 不存在，跳过"
          fi
          
          MANIFEST="packages/live_core/lib/src/sites/bilibili/bilibili_api.dart"
          if [ -f "$MANIFEST" ]; then
            
               awk '{if ($0 ~ /if \(byProtocol != 0\) return byProtocol;/) print "// " $0; else print}' "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               awk '{if ($0 ~ /final byProtocol = \(a.protocol ==/) print "// " $0; else print}' "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               awk '{ gsub(/&& *candidate\.codec == first\.codec/, ""); print }' "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               echo "✅ 已添加 , 直播支持 hevc"
              
              echo "$MANIFEST"
              grep -A5 -B5 "byProtocol″ "$MANIFEST" || true
          else
            echo "⚠️ $MANIFEST 不存在，跳过"
          fi

      # ====================== 自动修改  修改 android 包名 ======================
      - name: 修改 android 包名
        run: |
          MANIFEST="apps/pure_live/android/app/build.gradle.kts"
          if [ -f "$MANIFEST" ]; then
            if grep -q "com.mystyle.purelive.you.v5" "$MANIFEST"; then
            echo "⚠️ com.mystyle.purelive.you.v5 包名 已存在，跳过"
            else
               sed 's|applicationId = "com.mystyle.purelive"|applicationId = "com.mystyle.purelive.you.v5"|' "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               echo "✅ 已修改包名 com.mystyle.purelive.you.v5 "
              fi
              grep -A5 -B5 "com.mystyle.purelive" "$MANIFEST"
          else
            echo "⚠️ $MANIFEST 不存在，跳过"
          fi
          
       # ====================== 自动修改  解析播放链接 hevc 编码 ======================
      - name: 解析播放链接 hevc 编码增强解析
        run: |
          MANIFEST="apps/pure_live/lib/shared/rooms/playback_lines.dart"
          if [ -f "$MANIFEST" ]; then
            if grep -q "hevc|codec=265|" "$MANIFEST"; then
            echo "⚠️ codec=265 已存在，跳过"
            else
               sed "s/hevc|/hevc|codec=265|/" "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               sed "s/avc|/avc|codec=264|/" "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               echo "✅ 已修改包名 com.mystyle.purelive.you.v5 "
              fi
              grep -A5 -B5 "hevc|codec=265|" "$MANIFEST"
          else
            echo "⚠️ $MANIFEST 不存在，跳过"
          fi

      # ====================== 自动修改 去除 ssl验证 ======================
      - name: 去除 ssl验证
        run: |
          MANIFEST="packages/live_net/lib/src/io_http.dart"
          if [ -f "$MANIFEST" ]; then
            if grep -q 'badCertificateCallback' "$MANIFEST"; then
            echo "⚠️ 去除 ssl 已存在，跳过"
            else
               sed  's/() => HttpClient()/() { final client = HttpClient()/' "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               sed  's/route\.directive,/route.directive;\n     client.badCertificateCallback = (_, _, _) => true;\n      return client;\n }/' "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
               echo "✅ 已添加 badCertificateCallback"
              fi
              echo "flie: $MANIFEST"
              grep -A30 -B30 "badCertificateCallback" "$MANIFEST"
          else
            echo "⚠️ $MANIFEST 不存在，跳过"
          fi
          

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          
      - name: Toolchain
        id: toolchain
        run: |
          set -euo pipefail
          grep -E '^FLUTTER_VERSION=' toolchain.env >> "$GITHUB_ENV"
          version=$(sed -n 's/^version: \([0-9.]*\)+\([0-9]*\)$/\1/p' apps/pure_live/pubspec.yaml)
          build=$(sed -n 's/^version: \([0-9.]*\)+\([0-9]*\)$/\2/p' apps/pure_live/pubspec.yaml)
          echo "name=PureLive-$version-$build" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        name: 设置 Flutter 环境
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Packages and native bundles
        run: |
          set -euo pipefail
          python3 tools/flutter_sdk/prepare.py --apply
          python3 tools/flutter_sdk/prepare.py --test
          flutter --version
          flutter pub get --enforce-lockfile
          bash tools/ffmpeg_kit/fetch.sh android

      - name: 打包 APK
        working-directory: apps/pure_live
        env:
          # CI runners are ephemeral, so the configuration cache would be
          # stored but never reused. With android/gradle.properties keeping
          # problems=fail, storing is also a hard gate: unpinned latest-stable
          # Flutter requests its own NDK and AGP bootstraps it via sdkmanager
          # during configuration, which fails the store after the whole build.
          # Local builds keep the cache enabled and actually reuse it.
          GRADLE_OPTS: -Dorg.gradle.configuration-cache=false
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define=PURELIVE_BUILD_SOURCE=github-manual

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: apps/pure_live/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  build-windows:
    if: false
    runs-on: windows-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: Decode MSIX Certificate
        shell: pwsh
        run: |
          $certBase64 = "${{ secrets.CERTIFICATE }}".Trim() -replace '\s+', ''

          if (-not [string]::IsNullOrEmpty($certBase64)) {
            $certBytes = [System.Convert]::FromBase64String($certBase64)
            $certPath = Join-Path -Path (Get-Location) -ChildPath "certificate.pfx"
            [IO.File]::WriteAllBytes($certPath, $certBytes)
            "FINAL_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Update make_config.yaml
        if: env.FINAL_CERT_PATH != ''
        shell: pwsh
        run: |
          $configPath = "windows/packaging/msix/make_config.yaml"
          $absolutePath = $env:FINAL_CERT_PATH -replace '\\', '/'

          if (Test-Path $configPath) {
            $content = Get-Content $configPath -Raw
            $content = $content -replace 'certificate_path:\s*.*', "certificate_path: $absolutePath"
            Set-Content $configPath $content
          }

      - name: 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 启用 Flutter Windows
        run: flutter config --enable-windows-desktop

      - name: 更新 Flutter packages
        run: flutter pub get

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = "https://jrsoftware.org/download.php/is.exe"
          $output = "${{ runner.temp }}\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $output
          Start-Process -FilePath $output -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Copy Chinese language pack
        shell: pwsh
        run: |
          $source = "windows\packaging\exe\ChineseSimplified.isl"
          $target = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"

          if (Test-Path $source) {
            Copy-Item $source $target -Force
          }

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Package Windows
        run: fastforge package --platform windows --targets exe,msix

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows
          path: |
            dist/**/*.exe
            dist/**/*.msix
          retention-days: 7

  build-linux:
    if: false
    runs-on: ubuntu-22.04
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev unzip webkit2gtk-4.1 libasound2-dev
          sudo apt-get install -y gcc g++ autoconf automake debhelper glslang-dev ladspa-sdk xutils-dev libasound2-dev \
              libarchive-dev libbluray-dev libbs2b-dev libcaca-dev libcdio-paranoia-dev libdrm-dev \
              libdav1d-dev libdvdnav-dev libegl1-mesa-dev libepoxy-dev libfontconfig-dev libfreetype6-dev \
              libfribidi-dev libgl1-mesa-dev libgbm-dev libgme-dev libgsm1-dev libharfbuzz-dev libjpeg-dev \
              libbrotli-dev liblcms2-dev libmodplug-dev libmp3lame-dev libopenal-dev \
              libopus-dev libopencore-amrnb-dev libopencore-amrwb-dev libpulse-dev librtmp-dev \
              libsdl2-dev libsixel-dev libssh-dev libsoxr-dev libspeex-dev libtool \
              libv4l-dev libva-dev libvdpau-dev libvorbis-dev libvo-amrwbenc-dev \
              libunwind-dev libvpx-dev libwayland-dev libx11-dev libxext-dev \
              libxkbcommon-dev libxrandr-dev libxss-dev libxv-dev libxvidcore-dev \
              linux-libc-dev nasm ninja-build pkg-config python3 python3-docutils wayland-protocols \
              x11proto-core-dev zlib1g-dev libfdk-aac-dev libtheora-dev libwebp-dev \
              unixodbc-dev libpq-dev libxxhash-dev libaom-dev

      - name: Toolchain
        id: toolchain
        run: |
          set -euo pipefail
          grep -E '^FLUTTER_VERSION=' toolchain.env >> "$GITHUB_ENV"
          version=$(sed -n 's/^version: \([0-9.]*\)+\([0-9]*\)$/\1/p' apps/pure_live/pubspec.yaml)
          build=$(sed -n 's/^version: \([0-9.]*\)+\([0-9]*\)$/\2/p' apps/pure_live/pubspec.yaml)
          echo "name=PureLive-$version-$build" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        name: 设置 Flutter 环境
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Packages and native bundles
        run: |
          set -euo pipefail
          python3 tools/flutter_sdk/prepare.py --apply
          python3 tools/flutter_sdk/prepare.py --test
          flutter --version
          flutter pub get --enforce-lockfile
          bash tools/ffmpeg_kit/fetch.sh linux

      - name: 启用 Flutter Linux
        run: flutter config --enable-linux-desktop 

      - name: Install fastforge
        working-directory: apps/pure_live
        run: dart pub global activate fastforge
        
      - name: 配置 fastforge 文件
        run: |
          mkdir -p apps/pure_live/linux/packaging/deb
          
          cat > apps/pure_live/linux/packaging/deb/make_config.yaml <<'EOF'
          display_name: 纯粹直播
          package_name: pure-live
          maintainer:
            name: liuchuancong
            email: 17792321552@163.com
          priority: optional
          section: x11
          installed_size: 500000
          essential: false
          icon: assets/icons/icon.png
          generic_name: Livestream Player
          keywords:
            - Livestream
            - Video
          categories:
            - AudioVideo
            - Audio
            - Video
            - Network
          startup_notify: true
          EOF
          
          cat apps/pure_live/linux/packaging/deb/make_config.yaml

      - name: 打包 Linux
        working-directory: apps/pure_live
        run: fastforge package --platform linux --targets deb,zip --skip-clean

      - name: 上传 Linux 安装包
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux
          path: |
            apps/pure_live/dist/**/*.deb
            apps/pure_live/dist/**/*.zip
          retention-days: 7

  upload-release:
    runs-on: ubuntu-latest
    needs:
      - build-android
    permissions:
      contents: write
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      - name: 读取版本描述
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/version.json

      # ====================== 计算 Release Tag（去掉可能的 v/V 前缀） ======================
      - name: 计算 Release Tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            t="${{ github.event.inputs.tag_name }}"
            t="${t#v}"; t="${t#V}"
            echo "tag=$t" >> "$GITHUB_OUTPUT"
            echo "使用输入 tag: $t"
          else
            base=$(python3 -c "import json;print(json.load(open('assets/version.json'))['version'])")
            echo "tag=$base" >> "$GITHUB_OUTPUT"
            echo "使用 version.json tag: $base"
          fi

      # ====================== 判断是否为预发布 ======================
      # 规则：tag 带 .pre.N 后缀 → 预发布；否则沿用 version.json 的 prerelease 字段
      - name: 判断是否为预发布
        id: prerelease
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION_JSON: ${{ steps.version.outputs.content }}
        run: |
          set -euo pipefail
          if echo "$TAG" | grep -qE '\.pre\.[0-9]+$'; then
            is_pre="true"
            reason="tag 带 .pre.N 后缀"
          else
            is_pre=$(echo "$VERSION_JSON" | python3 -c "import sys,json;print(str(json.load(sys.stdin).get('prerelease', False)).lower())")
            reason="沿用 assets/version.json 的 prerelease 字段"
          fi
          echo "prerelease=$is_pre" >> "$GITHUB_OUTPUT"
          echo "判定 prerelease=$is_pre（$reason）"

      # ====================== 构建 Release Body ======================
      - name: 构建 Release Body
        id: release_body
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION_JSON: ${{ steps.version.outputs.content }}
        run: |
          set -euo pipefail
          version_desc=$(echo "$VERSION_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('version_desc',''))")
          cat << EOF > release_body.txt

          # 纯粹直播 ${TAG}

          ### 📝 本次更新

          ${version_desc}

          EOF
          echo "body_path=$(pwd)/release_body.txt" >> "$GITHUB_OUTPUT"

      # ====================== 上传至 Release ======================
      - name: 上传至 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.tag }}
          name: v${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.release_body.outputs.body_path }}
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          generate_release_notes: false
          append_body: false
          make_latest: true
          fail_on_unmatched_files: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出状态
        if: always()
        run: 'echo "✅ Release published with status: ${{ job.status }}"' 